# Runs every check on each pull request and on pushes to main.
# The job is named `checks`: auto-merge looks up this check's result by that name.
# No secrets and no deploys here; Vercel deploys on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # createdb, psql and dropdb in run-local.sh read these.
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: File names differ by more than case
        run: npm run check:case

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -w autokolab

      # Node 20 has no built-in WebSocket; turning Node 22's off checks the helper still works there (AK-105).
      - name: Unit tests without a built-in WebSocket (as on Node 20)
        run: npm test -w autokolab -- --execArgv=--no-experimental-websocket

      - name: Website unit tests
        run: npm test -w autokolab-site

      # The runner comes with PostgreSQL installed but stopped. Using it means no image to download:
      # Docker Hub and its AWS mirror both rate-limit pulls (AK-114).
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          pg_isready
          sudo -u postgres psql -h /var/run/postgresql -q -c "alter user $PGUSER with password '$PGPASSWORD'"
          psql -tAc 'select version()'

      - name: Database access-rule tests
        run: bash supabase/tests/run-local.sh

      - name: Website build
        run: npm run build -w autokolab-site
